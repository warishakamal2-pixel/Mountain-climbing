<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Booking enquiry – Alpine Ascents</title>
    <meta name="description" content="Enquiry form.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="booking">
    <div id="nav"></div>
    <main>
        <section style="padding-top:7rem">
            <div class="wrap rv">
                <h1 style="font-size:clamp(2rem,5vw,3.5rem)">Booking enquiry</h1>
                <form data-form novalidate>
                    <div><label for="n">Full name</label><input id="n" name="n" type="text" required><span
                            class="err"></span></div>
                    <div><label for="e">Email</label><input id="e" name="e" type="email" required><span
                            class="err"></span></div>
                    <div><label for="exp">Expedition</label><select id="exp" required></select><span class="err"></span>
                    </div>
                    <div><label for="d">Preferred dates</label><input id="d" name="d" type="text" required><span
                            class="err"></span></div>
                    <div><label for="g">Group size</label><input id="g" name="g" type="number" required><span
                            class="err"></span></div>
                    <div><label for="m">Message</label><textarea id="m" rows="4"></textarea></div><button
                        class="btn pri">Send enquiry</button>
                    <p class="ok" role="status"></p>
                </form>
            </div>
        </section>
    </main>
    <div id="foot"></div>
    <script src="js/main.js"></script>
</body>

</html>
